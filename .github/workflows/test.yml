name: Run Testbenches

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get install -y iverilog

      - name: Run register testbench
        run: |
          iverilog -g2012 -o tb_register \
            01-registers/tb/tb_register.sv \
            01-registers/rtl/register.sv \
          && vvp tb_register

      - name: Run ALU testbench
        run: |
          iverilog -g2012 -o tb_alu \
            02-alu/tb/tb_alu.sv \
            02-alu/rtl/alu.sv \
          && vvp tb_alu

      - name: Run memory testbench
        run: |
          iverilog -g2012 -o tb_memory \
            03-memory/tb/tb_memory.sv \
            03-memory/rtl/memory.sv \
          && vvp tb_memory

      - name: Run PC testbench
        run: |
          iverilog -g2012 -o tb_pc \
            04-pc/tb/tb_pc.sv \
            04-pc/rtl/pc.sv \
          && vvp tb_pc

